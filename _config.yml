# Build settings
markdown: kramdown
permalink: pretty

# Don't publish the karpathy.github.io reference clone (if still present)
# or bundler/vendor dirs if you keep them around.
exclude:
  - karpathy.github.io/
  - vendor/
  - Gemfile
  - Gemfile.lock

highlighter: rouge
kramdown:
  input: GFM
  auto_ids: true
  syntax_highlighter: rouge
  math_engine: mathjax
